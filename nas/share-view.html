.draghandle{cursor:grab}.draghandle:active{cursor:grabbing}
.tab-drag-ghost,.dragghost{pointer-events:none;box-shadow:var(--ui-shadow)}
.module-drop-target,.member-drop-target,.team-drop-target,.calendar-drop-target{outline:2px solid var(--ui-drop);outline-offset:2px}

body{margin:0;background:var(--ui-subtle);font-family:var(--ui-font);color:var(--ui-text)}main{max-width:960px;margin:0 auto;padding:32px 20px}.public-header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px}article,form{padding:20px;margin:16px 0;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:16px}h2{font-size:18px;margin-top:0}p,pre{white-space:pre-wrap;overflow-wrap:anywhere;font:400 14px/1.65 var(--ui-font)}label{display:grid;gap:8px;margin:12px 0}input,button{font:inherit;min-height:40px;padding:8px 12px;border:1px solid var(--ui-line);border-radius:12px;background:white}button{cursor:pointer}img,video,iframe{max-width:100%;display:block;border-radius:12px}iframe{width:100%;height:70vh;border:1px solid var(--ui-line)}audio{max-width:100%}a{color:var(--ui-accent,#245bd6)}.public-file{border-top:1px solid var(--ui-line);padding-top:12px;margin-top:12px}.public-actions{display:flex;gap:12px;flex-wrap:wrap}.muted{color:var(--ui-muted)}[hidden]{display:none!important}
</style><main><header class="public-header"><h1 id="title">공유 자료</h1><button id="refresh">새로고침</button></header><p id="status" role="status">불러오는 중…</p><form id="login" hidden><h2>지정 사용자 로그인</h2><p>이 링크에 지정된 NAS 계정으로 로그인하세요.</p><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button></form><div class="public-actions"><button id="logout" hidden>로그아웃</button></div><section id="content" aria-label="공유 내용"></section><footer><p class="muted">선택한 항목만 표시하는 읽기 전용 공유입니다. 다운로드 제한은 다운로드 동작과 원본 전달을 제한하며, 화면에 표시되는 내용·미디어의 저장까지 막지는 못합니다.</p><small>Production</small></footer></main><script>(()=>{'use strict';const token=location.pathname.split('/').pop(),endpoint='/public/shares/'+token,$=id=>document.getElementById(id);let requestNumber=0;
const node=(tag,text)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el};
async function api(path,options){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...options}),data=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(data.detail||data.error||'공유를 열 수 없습니다.'),{status:r.status});return data}
function link(href,label){const a=node('a',label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
async function load(){const request=++requestNumber;$('content').replaceChildren();$('status').textContent='불러오는 중…';$('login').hidden=true;
try{const data=await api(endpoint);if(request!==requestNumber)return;$('title').textContent=data.title;document.title=data.title+' · 공유';$('status').textContent=(data.completed?'완료 보존본 · 읽기 전용':'실시간 공유 · 읽기 전용')+(data.expiresAt?' · '+new Date(data.expiresAt).toLocaleString()+'까지':'');if(!data.items.length)$('content').append(node('p','공유된 항목이 없거나 삭제되었습니다.'));
for(const item of data.items){const article=node('article');article.append(node('h2',item.title||item.name||item.section||'자료'));if(item.text||item.body||item.description)article.append(node('p',item.text||item.body||item.description));const date=[item.date,item.startTime,item.endDate,item.endTime,item.due].filter(Boolean).join(' ');if(date)article.append(node('p',date));if(item.url)article.append(link(item.url,'외부 링크 열기'));if(item.headers?.length)article.append(node('p',item.headers.join(' · ')));for(const row of item.table||[])article.append(node('p',row.join(' · ')));for(const row of item.items||[])article.append(node('p',Object.values(row).join(' · ')));for(const record of item.records||[]){article.append(node('h3',record.title));for(const v of record.values)article.append(node('p',v.label+': '+v.value))}
for(const file of item.files||[]){const box=node('div');box.className='public-file';box.append(node('h3',file.name));const address=endpoint+'/files/'+encodeURIComponent(file.id),mime=file.mime||'';
if(/^image\/(png|jpeg|webp|gif)$/.test(mime)){const img=node('img');img.src=address;img.alt=file.name;img.loading='lazy';box.append(img)}else if(/^(video|audio)\//.test(mime)){const media=node(mime.startsWith('video/')?'video':'audio');media.src=address;media.controls=true;media.preload='metadata';media.setAttribute('controlsList',data.allowDownload?'':'nodownload');box.append(media)}else if(mime==='application/pdf'){const frame=node('iframe');frame.title=file.name;frame.src=address+'#toolbar='+(data.allowDownload?'1':'0');box.append(frame)}else if(/^text\//.test(mime)||/\.docx$/i.test(file.name)){const preview=node('pre','문서 불러오는 중…');box.append(preview);api(address+'?preview=1').then(d=>{if(request===requestNumber)preview.textContent=d.text+(d.truncated?'\n\n미리보기는 앞부분 2MB까지 표시합니다. 전체 내용은 다운로드가 허용된 경우 파일로 확인하세요.':'')}).catch(e=>{preview.textContent=e.message})}else box.append(node('p','이 파일 형식은 미리보기를 지원하지 않습니다.'));
if(data.allowDownload)box.append(link(address+'?download=1','파일 다운로드'));article.append(box)}$('content').append(article)}
}catch(e){if(request!==requestNumber)return;$('status').textContent=e.message;if(e.status===401){$('login').hidden=false;$('logout').hidden=false}else if(e.status===403){$('login').hidden=false;$('logout').hidden=false}}}
$('refresh').onclick=load;for(const [id,path] of [['login','login']])$(id).onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;try{await api('/public/auth/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(id==='login')form.elements.password.value='';$('logout').hidden=false;await load()}catch(error){$('status').textContent=error.message}finally{button.disabled=false}};
$('logout').onclick=async()=>{try{await api('/public/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('logout').hidden=true;await load()}catch(e){$('status').textContent=e.message}};load();})();
</script></html>
