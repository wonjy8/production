<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="pn-base" content="__PRODUCTION_BASE__"><base href="__PRODUCTION_BASE__">
<title>Production</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f5f5;color:#222;margin:0;padding:8vh 20px}main{max-width:440px;margin:auto;background:white;padding:28px;border-radius:12px}h1{font-size:22px}button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:#222;color:white;cursor:pointer}#status{overflow-wrap:anywhere}</style>
</head><body><main><h1>Production</h1><p id="status" role="status">앱을 불러오는 중…</p><div id="boot-help" hidden><p id="boot-reason">네트워크 연결을 확인하거나 앱을 다시 열어보세요.</p><button id="retry">다시 시도</button> <button id="connection-check">연결 확인</button><p><a id="browser-mode" href="__PRODUCTION_BASE__">웹에서 열기</a></p></div><noscript><p>앱을 사용하려면 브라우저에서 JavaScript를 허용하세요.</p></noscript></main><script type="module" src="./pages-loader.js"></script><script>setTimeout(()=>{const help=document.querySelector('#boot-help');if(help&&help.hidden){document.querySelector('#status').textContent='앱 로딩이 지연되고 있습니다.';document.querySelector('#boot-reason').textContent='네트워크 연결이나 브라우저의 사이트 실행 허용 상태를 확인하세요.';help.hidden=false}},20000);document.querySelector('#retry').onclick=()=>location.reload();document.querySelector('#connection-check').onclick=()=>{document.querySelector('#boot-reason').textContent=navigator.onLine?'인터넷에 연결되어 있습니다. 앱을 다시 열거나 웹에서 열기를 선택하세요.':'인터넷 연결이 끊어졌습니다. 연결 후 다시 시도하세요.'};</script></body></html>
