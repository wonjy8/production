<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>공유 자료 · Production</title><style>{{DESIGN_CSS}}
body{margin:0;background:var(--ui-subtle);font-family:var(--ui-font);color:var(--ui-text)}main{max-width:960px;margin:0 auto;padding:32px 20px}.public-header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px}article,form{padding:20px;margin:16px 0;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:16px}h2{font-size:18px;margin-top:0}p,pre{white-space:pre-wrap;overflow-wrap:anywhere;font:400 14px/1.65 var(--ui-font)}label{display:grid;gap:8px;margin:12px 0}input,button{font:inherit;min-height:40px;padding:8px 12px;border:1px solid var(--ui-line);border-radius:12px;background:white}button{cursor:pointer}img,video,iframe{max-width:100%;display:block;border-radius:12px}iframe{width:100%;height:70vh;border:1px solid var(--ui-line)}audio{max-width:100%}a{color:var(--ui-accent,#245bd6)}.public-file{border-top:1px solid var(--ui-line);padding-top:12px;margin-top:12px}.public-actions{display:flex;gap:12px;flex-wrap:wrap}.muted{color:var(--ui-muted)}[hidden]{display:none!important}
</style><main><header class="public-header"><h1 id="title">공유 자료</h1><button id="refresh">새로고침</button></header><p id="status" role="status">불러오는 중…</p><form id="login" hidden><h2>지정 사용자 로그인</h2><p>이 링크에 지정된 NAS 계정으로 로그인하세요.</p><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">로그인</button></form><div class="public-actions"><button id="logout" hidden>로그아웃</button></div><section id="content" aria-label="공유 내용"></section><footer><p class="muted">선택한 항목만 표시하는 읽기 전용 공유입니다. 다운로드 제한은 다운로드 동작과 원본 전달을 제한하며, 화면에 표시되는 내용·미디어의 저장까지 막지는 못합니다.</p><small>Production {{APP_RELEASE_VERSION}}</small></footer></main><script>{{VIEWER_JS}}</script></html>
