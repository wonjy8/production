appSearch.querySelectorAll('[data-search-scope]').forEach(button=>button.onclick=()=>{searchScope=button.dataset.searchScope;appSearch.querySelectorAll('[data-search-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));drawAppSearch()});
$('#app-search-results').onclick=async e=>{const button=e.target.closest('[data-search-result]');if(!button)return;const row=searchResults[Number(button.dataset.searchResult)];appSearch.classList.remove('is-open');appSearch.close();appSearchButton.setAttribute('aria-expanded','false');try{if(row.kind==='reference'||row.referenceId){sourceSection=row.recordType==='portfolio'?'portfolios':row.recordType==='source'?'sources':'references';localStorage.setItem('pn-source-section',sourceSection);await openRefs();if(row.moduleId)window.productionSearchTarget=row;await openReferenceModules(refs.find(r=>r.id===(row.referenceId||row.entityId)))}else if(row.kind==='member'||row.kind==='database'){await openDatabase(row.collection);const item=databaseRows.find(r=>r.id===row.entityId);if(item)databaseForm(item)}else if(row.kind==='projectcategory'){projectCatalogCategory=row.entityId;await openSettings('projects')}else if(row.kind==='catalog'){catalogSettingsGroup=equipmentGroup(row.section);if(row.brand)catalogSettingsBrand=row.brand;await openSettings('equipment')}else{window.productionSearchTarget=row;if(row.projectId)await openProduction(row.projectId,row.section);else await openProduction(undefined,'overview',false,row.productionId);if(row.kind==='module'&&!row.moduleId)requestAnimationFrame(()=>{const node=document.getElementById('module-'+row.entityId)||[...document.querySelectorAll('.module')].find(n=>n.textContent.includes(row.title));node?.scrollIntoView({behavior:'smooth',block:'start'})})}}catch(err){toast(err.message||'불러오기 실패')}};
document.addEventListener('keydown',e=>{if(document.body.classList.contains('document-mode'))return;if(e.key==='Escape'&&appSearch.open&&!document.querySelector('dialog:modal')){closeAppSearch();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(appSearch.open)closeAppSearch();else openAppSearch()}});

$('#app-search-input').onkeydown=e=>{if(e.isComposing)return;if(e.key==='ArrowDown'||e.key==='Enter'){const first=$('#app-search-results').querySelector('[data-search-result]');if(first){e.preventDefault();if(e.key==='Enter')first.click();else first.focus()}}};$('#app-search-results').onkeydown=e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const buttons=[...$('#app-search-results').querySelectorAll('[data-search-result]')],index=buttons.indexOf(document.activeElement);e.preventDefault();if(e.key==='ArrowUp'&&index===0)$('#app-search-input').focus();else buttons[Math.max(0,Math.min(buttons.length-1,index+(e.key==='ArrowDown'?1:-1)))]?.focus()};
${appNavigationScript}
</script></body></html>
